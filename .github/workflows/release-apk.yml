name: Release APK

on:
  # 打 tag 自动发布：git tag v0.1.3-voice && git push fork v0.1.3-voice
  push:
    tags:
      - 'v*'
  # Actions 页手动触发（tag 留空则按 git describe 自动命名）
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3-voice). Empty = auto from git describe'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 签名走 build-logic 既有通道（ProjectExtensions.kt）：
      # 仓库 secrets 配置 SIGN_KEY_BASE64/SIGN_KEY_PWD/SIGN_KEY_ALIAS 时
      # 产出已签名 *-release.apk；未配置则产出 *-release-unsigned.apk
      # （epn 对空值 isNotBlank 兜底，不会误用空 keystore）
      - name: Build Release APKs
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SF_FREE_API_KEY: ${{ secrets.SF_FREE_API_KEY }}
        run: ./gradlew :app:assembleRelease

      - name: Resolve tag and collect APKs
        id: meta
        run: |
          # 优先级：手动输入 > 触发 tag > git describe 自动命名
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(git describe --tags --long --always | sed 's/^v//')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 只保留 APK 文件（排除 output-metadata 等）
          mkdir -p release-apks
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" release-apks/*.apk \
            --repo aimkiray/fcitx5-android \
            --target "${{ github.sha }}" \
            --title "fcitx5-android voice $TAG" \
            --generate-notes \
            --verify-tag 2>/dev/null || \
          gh release create "$TAG" release-apks/*.apk \
            --repo aimkiray/fcitx5-android \
            --target "${{ github.sha }}" \
            --title "fcitx5-android voice $TAG" \
            --generate-notes
